<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRODIT UABC - Completa tu perfil</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --blue: #2563EB;
  --blue-light: #3B82F6;
  --blue-glow: #60A5FA;
  --dark: #0A0E1A;
  --dark2: #0F1629;
  --dark3: #161E35;
  --text: #E2E8F0;
  --text-muted: #94A3B8;
  --border: rgba(59,130,246,0.2);
  --green: #10B981;
  --red: #EF4444;
}
body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--dark);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 1rem;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(37,99,235,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(37,99,235,0.04) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
}

.card {
  position: relative;
  background: var(--dark2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 2.5rem 2rem;
  width: 100%;
  max-width: 520px;
  box-shadow: 0 0 60px rgba(37,99,235,0.08), 0 40px 80px rgba(0,0,0,0.4);
}
/* cyber corner accents */
.card::before { content:''; position:absolute; top:-1px; left:-1px; width:14px; height:14px; border-top:2px solid var(--blue-light); border-left:2px solid var(--blue-light); border-radius:2px 0 0 0; }
.card::after  { content:''; position:absolute; bottom:-1px; right:-1px; width:14px; height:14px; border-bottom:2px solid var(--blue-light); border-right:2px solid var(--blue-light); border-radius:0 0 2px 0; }

.logo { font-size: 1rem; font-weight: 700; color: var(--blue-light); letter-spacing: .05em; margin-bottom: 1.5rem; }
h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: .35rem; }
.subtitle { font-size: .85rem; color: var(--text-muted); margin-bottom: 2rem; line-height: 1.5; }

/* Avatar */
.avatar-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
.avatar { width: 60px; height: 60px; border-radius: 50%; background: var(--dark3); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700; color: var(--blue-light); overflow: hidden; flex-shrink: 0; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar-info { min-width: 0; }
.avatar-name { font-weight: 600; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.avatar-email { font-size: .78rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Form */
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.form-group { margin-bottom: 1rem; }
label { display: block; font-size: .78rem; color: var(--text-muted); font-weight: 500; margin-bottom: .35rem; letter-spacing: .03em; text-transform: uppercase; }
input, select {
  width: 100%;
  background: var(--dark);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: .65rem .9rem;
  color: var(--text);
  font-family: inherit;
  font-size: .9rem;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
input:focus, select:focus {
  border-color: var(--blue-light);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
}
select option { background: var(--dark2); }
input[readonly] { opacity: .6; cursor: default; }

.btn {
  width: 100%;
  background: var(--blue);
  color: #fff;
  border: none;
  padding: .85rem;
  border-radius: 10px;
  cursor: pointer;
  font-family: inherit;
  font-size: .95rem;
  font-weight: 600;
  margin-top: .5rem;
  transition: background .2s, transform .1s;
  letter-spacing: .02em;
}
.btn:hover { background: #1d4ed8; }
.btn:active { transform: scale(.99); }
.btn:disabled { opacity: .6; cursor: default; transform: none; }

.alert { padding: .7rem 1rem; border-radius: 8px; font-size: .84rem; margin-bottom: 1rem; display: none; }
.alert-error { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); color: #fca5a5; }
.alert-success { background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.3); color: #6ee7b7; }
.show { display: block !important; }

.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: .4rem; }
@keyframes spin { to { transform: rotate(360deg); } }

@media(max-width:500px) { .row { grid-template-columns: 1fr; } .card { padding: 2rem 1.25rem; } }
</style>
</head>
<body>
<div class="card">
  <div class="logo" style="margin-bottom:1.5rem"><img src="https://drive.google.com/thumbnail?id=1b8v80IfvGNFsoPcvaPPXrPyTrhORYtRC&sz=w600" alt="CRODT-UABC" style="height:42px;width:auto;object-fit:contain;display:block;margin:0 auto" onerror="this.parentNode.innerHTML='⚡ CRODT UABC';this.parentNode.style.color='var(--blue-light)';this.parentNode.style.fontWeight='700';this.parentNode.style.letterSpacing='.05em'"></div>
  <h1>Completa tu perfil</h1>
  <p class="subtitle">Es tu primera vez aquí. Cuéntanos un poco más sobre ti para continuar.</p>

  <div class="avatar-row">
    <div class="avatar" id="avatarEl">?</div>
    <div class="avatar-info">
      <div class="avatar-name" id="displayName">Cargando...</div>
      <div class="avatar-email" id="displayEmail">—</div>
    </div>
  </div>

  <div class="alert alert-error" id="errAlert"></div>
  <div class="alert alert-success" id="okAlert"></div>

  <form id="profileForm" onsubmit="doSave(event)">
    <div class="form-group">
      <label>Nombre completo *</label>
      <input type="text" id="fNombre" required placeholder="Ej. Cristopher Vea">
    </div>
    <div class="row">
      <div class="form-group">
        <label>Institución *</label>
        <input type="text" id="fInstitucion" required placeholder="UNAM, IPN, TEC...">
      </div>
      <div class="form-group">
        <label>Rol *</label>
        <select id="fRol" required>
          <option value="">Selecciona...</option>
          <option value="Coach">Coach</option>
          <option value="Participante">Participante</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="form-group">
        <label>Ciudad *</label>
        <input type="text" id="fCiudad" required placeholder="Ciudad de México">
      </div>
      <div class="form-group">
        <label>País *</label>
        <input type="text" id="fPais" required placeholder="México" value="México">
      </div>
    </div>
    <!-- Campos extra para Participante (aparecen dinámicamente) -->
    <div id="participanteFields" style="display:none">
      <div class="row">
        <div class="form-group">
          <label>Edad *</label>
          <input type="number" id="fEdad" min="5" max="99" placeholder="18">
        </div>
        <div class="form-group">
          <label>Escolaridad *</label>
          <select id="fEscolaridad">
            <option value="">Selecciona...</option>
            <option value="Secundaria">Secundaria</option>
            <option value="Preparatoria">Preparatoria</option>
            <option value="Universidad">Universidad</option>
            <option value="Posgrado">Posgrado</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
      </div>
    </div>
    <div class="form-group">
      <label>Celular</label>
      <input type="tel" id="fCelular" placeholder="+52 55 1234 5678">
    </div>
    <button class="btn" type="submit" id="saveBtn">Guardar y continuar →</button>
  </form>
</div>

<script>
var TOKEN = '<?= token ?>';
var USER_EMAIL = '';
var USER_NAME  = '';

// Verificar que hay token válido
if (!TOKEN) {
  showErr('Sesión no válida. Redirigiendo al inicio...');
  google.script.run
    .withSuccessHandler(function(url) {
      document.getElementById('errAlert').innerHTML =
        'Sesión no válida. <a href="' + url + '" target="_top" style="color:#fca5a5;font-weight:700;text-decoration:underline;">Volver al inicio →</a>';
    })
    .getLoginUrl();
}

// Cargar datos del usuario usando token
google.script.run
  .withSuccessHandler(function(info) {
    if (info.error) {
      google.script.run
        .withSuccessHandler(function(url) {
          document.getElementById('errAlert').innerHTML =
            info.error + ' <a href="' + url + '" target="_top" style="color:#fca5a5;font-weight:700;text-decoration:underline;">Volver al inicio →</a>';
          document.getElementById('errAlert').classList.add('show');
        })
        .getLoginUrl();
      return;
    }
    USER_EMAIL = info.email || '';
    USER_NAME  = info.name  || '';

    document.getElementById('displayEmail').textContent = USER_EMAIL;
    document.getElementById('displayName').textContent  = USER_NAME;
    document.getElementById('fNombre').value = USER_NAME;

    // Avatar: foto o iniciales
    var av = document.getElementById('avatarEl');
    if (info.picture) {
      av.innerHTML = '<img src="' + info.picture + '" alt="avatar">';
    } else {
      av.textContent = USER_NAME.charAt(0).toUpperCase();
    }

    // Si ya tiene campos guardados, pre-rellenar
    if (info.institucion) document.getElementById('fInstitucion').value = info.institucion;
    if (info.rol)         document.getElementById('fRol').value         = info.rol;
    if (info.ciudad)      document.getElementById('fCiudad').value      = info.ciudad;
    if (info.pais)        document.getElementById('fPais').value        = info.pais;
    if (info.celular)     document.getElementById('fCelular').value     = info.celular;
  })
  .withFailureHandler(function(err) {
    showErr('Error al cargar datos: ' + (err.message || err));
  })
  .getUserInfo(TOKEN);

// Mostrar/ocultar campos de participante según rol
document.getElementById('fRol').addEventListener('change', function() {
  var pFields = document.getElementById('participanteFields');
  var isParticipante = this.value === 'Participante';
  pFields.style.display = isParticipante ? 'block' : 'none';
  document.getElementById('fEdad').required = isParticipante;
  document.getElementById('fEscolaridad').required = isParticipante;
});

function doSave(e) {
  e.preventDefault();
  var rol = document.getElementById('fRol').value;

  // Validar campos extra de participante
  if (rol === 'Participante') {
    var edad = document.getElementById('fEdad').value;
    var escolaridad = document.getElementById('fEscolaridad').value;
    if (!edad || !escolaridad) {
      showErr('Completa tu edad y escolaridad.');
      return;
    }
  }

  var btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Guardando...';

  var data = {
    nombre:      document.getElementById('fNombre').value.trim(),
    foto:        '',
    institucion: document.getElementById('fInstitucion').value.trim(),
    rol:         rol,
    ciudad:      document.getElementById('fCiudad').value.trim(),
    pais:        document.getElementById('fPais').value.trim(),
    celular:     document.getElementById('fCelular').value.trim(),
    edad:        document.getElementById('fEdad').value || '',
    escolaridad: document.getElementById('fEscolaridad').value || ''
  };

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) {
        btn.disabled = false;
        btn.textContent = 'Guardar y continuar →';
        showErr(res.error || 'Error al guardar');
        return;
      }
      document.getElementById('errAlert').classList.remove('show');
      btn.innerHTML = '<span class="spinner"></span>Redirigiendo...';
      try { window.top.location.href = res.dashboardUrl; }
      catch(_) { window.location.href = res.dashboardUrl; }
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      btn.textContent = 'Guardar y continuar →';
      showErr('Error de conexión: ' + (err.message || err));
    })
    .saveUserProfile(TOKEN, data);
}

function showErr(msg) {
  var el = document.getElementById('errAlert');
  el.textContent = msg; el.classList.add('show');
  document.getElementById('okAlert').classList.remove('show');
}
function showOk(msg) {
  var el = document.getElementById('okAlert');
  el.textContent = msg; el.classList.add('show');
  document.getElementById('errAlert').classList.remove('show');
}
</script>
</body>
</html>
